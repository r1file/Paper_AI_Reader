name: Build Release

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: Release version, for example v1.0.0
        required: true
        default: v0.1.0
      upload_to_release:
        description: Upload generated zip files to the GitHub Release with this version tag
        required: true
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    env:
      RELEASE_VERSION: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.version }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux GUI libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libxcb-cursor0 libxcb-icccm4 libxcb-image0 libxcb-keysyms1 libxcb-randr0 libxcb-render-util0 libxcb-shape0 libxcb-xinerama0 libxcb-xfixes0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt "pyinstaller>=6.0"

      - name: Build app artifact
        run: python scripts/build_release.py --version "${{ env.RELEASE_VERSION }}" --app-only

      - name: Build source artifact
        if: runner.os == 'Linux'
        run: python scripts/build_release.py --version "${{ env.RELEASE_VERSION }}" --source-only

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: paper-ai-reader-${{ matrix.os }}
          path: release/*.zip

      - name: Upload files to GitHub Release
        if: github.event_name == 'release' || inputs.upload_to_release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ env.RELEASE_VERSION }}" release/*.zip --clobber
